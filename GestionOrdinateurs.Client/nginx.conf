server {
    listen 5189;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|dll|pdb|dat|blat)$ {
        types {
            application/wasm wasm;
            application/octet-stream dll pdb dat blat;
        }
        try_files $uri =404;
    }
}